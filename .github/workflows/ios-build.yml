name: Deploy to App Store

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Track to deploy to'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore

jobs:
  build_and_deploy:
    name: Build & Deploy iOS App
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Cache Swift Package Manager Dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SnackSwapAdventure/SnackSwapAdventure.xcodeproj \
            -scheme SnackSwapAdventure

      - name: Setup App Store Connect API Key (if provided)
        env:
          RAW_KEY_SECRET: ${{ secrets.APPSTORE_API_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APPSTORE_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY || secrets.APPSTORE_API_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORE_KEY_ID || secrets.APPLE_KEY_ID }}
        run: |
          if [ -n "$RAW_KEY_SECRET" ] && [ -n "$KEY_ID" ]; then
            echo "Setting up App Store Connect API Key for Key ID: $KEY_ID..."
            mkdir -p ~/.private_keys
            mkdir -p ~/.appstoreconnect/private_keys

            KEY_FILE1=~/.private_keys/AuthKey_${KEY_ID}.p8
            KEY_FILE2=~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

            if echo "$RAW_KEY_SECRET" | grep -q "BEGIN PRIVATE KEY"; then
              echo "$RAW_KEY_SECRET" > "$KEY_FILE1"
              echo "$RAW_KEY_SECRET" > "$KEY_FILE2"
            else
              echo "$RAW_KEY_SECRET" | tr -d '\r\n ' | base64 --decode > "$KEY_FILE1"
              echo "$RAW_KEY_SECRET" | tr -d '\r\n ' | base64 --decode > "$KEY_FILE2"
            fi
            chmod 600 "$KEY_FILE1" "$KEY_FILE2"
            echo "API Key AuthKey_${KEY_ID}.p8 prepared."
          fi

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.P12_BASE64 || secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.BUILD_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 || secrets.BUILD_PROVISION_PROFILE_BASE64 || secrets.IOS_PROVISION_PROFILE_BASE64 || secrets.PROVISION_PROFILE_BASE64 || secrets.PROVISIONING_PROFILE || secrets.PROVISION_PROFILE || secrets.MOBILEPROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: 'temporary_keychain_password'
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing signing certificate..."
            echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode > $CERTIFICATE_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | xargs)
            security default-keychain -s $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            echo "=== DIAGNOSTICS: KEYCHAINS SEARCH LIST ==="
            security list-keychains -d user
            echo "=== DIAGNOSTICS: CODE SIGNING IDENTITIES ==="
            security find-identity -v -p codesigning
          fi

          if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Installing provisioning profile..."
            echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode > $PP_PATH
            UUID=$(security cms -D -i $PP_PATH 2>/dev/null | grep -A1 "<key>UUID</key>" | grep "<string>" | sed -e 's/.*<string>//' -e 's/<\/string>.*//' || true)
            PROFILE_NAME=$(security cms -D -i $PP_PATH 2>/dev/null | grep -A1 "<key>Name</key>" | grep "<string>" | sed -e 's/.*<string>//' -e 's/<\/string>.*//' || true)
            
            if [ -n "$UUID" ]; then
              echo "Extracted Provisioning Profile Name: $PROFILE_NAME"
              echo "Extracted Provisioning Profile UUID: $UUID"
              mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
              cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
              echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
              echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
            fi
          fi

      - name: Build & Archive App
        run: |
          SIGNING_FLAGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          if [ -n "${{ env.PROFILE_UUID }}" ]; then
            echo "Using manual signing with provisioning profile UUID: ${{ env.PROFILE_UUID }}"
            SIGNING_FLAGS="CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=\"Apple Distribution\" PROVISIONING_PROFILE_SPECIFIER=\"${{ env.PROFILE_UUID }}\""
          fi

          xcodebuild -project SnackSwapAdventure/SnackSwapAdventure.xcodeproj \
            -scheme SnackSwapAdventure \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/SnackSwapAdventure.xcarchive \
            DEVELOPMENT_TEAM=Z2RB57KVQ5 \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            $SIGNING_FLAGS \
            archive

      - name: Export IPA Package
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORE_KEY_ID || secrets.APPLE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORE_ISSUER_ID || secrets.APPLE_ISSUER_ID }}
        run: |
          if [ -n "${{ env.PROFILE_UUID }}" ]; then
            echo "Building ExportOptions with local profile UUID: ${{ env.PROFILE_UUID }}"
            cat <<EOF > ./ExportOptions-Dynamic.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>destination</key>
          	<string>export</string>
          	<key>method</key>
          	<string>app-store</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>teamID</key>
          	<string>Z2RB57KVQ5</string>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>com.snackswap.adventure</key>
          		<string>${{ env.PROFILE_UUID }}</string>
          	</dict>
          	<key>stripSwiftSymbols</key>
          	<true/>
          	<key>uploadSymbols</key>
          	<true/>
          </dict>
          </plist>
          EOF

            xcodebuild -exportArchive \
              -archivePath ./build/SnackSwapAdventure.xcarchive \
              -exportOptionsPlist ./ExportOptions-Dynamic.plist \
              -exportPath ./build/output \
              ENABLE_PREVIEWS=NO \
              COMPILER_INDEX_STORE_ENABLE=NO
          else
            echo "Exporting using App Store Connect API Key automatic signing."
            AUTH_FLAGS=""
            KEY_PATH=""
            if [ -f "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" ]; then
              KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
            elif [ -f "$HOME/.private_keys/AuthKey_${KEY_ID}.p8" ]; then
              KEY_PATH="$HOME/.private_keys/AuthKey_${KEY_ID}.p8"
            fi

            if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_PATH" ]; then
              echo "Found API Key at $KEY_PATH. Using authentication flags for export."
              AUTH_FLAGS="-allowProvisioningUpdates -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID -authenticationKeyPath $KEY_PATH"
            else
              echo "Warning: API Key parameters incomplete. Falling back to basic allowProvisioningUpdates."
              AUTH_FLAGS="-allowProvisioningUpdates"
            fi

            xcodebuild -exportArchive \
              -archivePath ./build/SnackSwapAdventure.xcarchive \
              -exportOptionsPlist SnackSwapAdventure/ExportOptions-AppStoreConnect.plist \
              -exportPath ./build/output \
              DEVELOPMENT_TEAM=Z2RB57KVQ5 \
              ENABLE_PREVIEWS=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              $AUTH_FLAGS
          fi

      - name: Upload to TestFlight
        if: ${{ inputs.track == 'testflight' || inputs.track == '' || github.event_name == 'push' }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORE_KEY_ID || secrets.APPLE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORE_ISSUER_ID || secrets.APPLE_ISSUER_ID }}
        run: |
          IPA_FILE=$(find ./build/output -name "*.ipa" | head -n 1)
          
          if [ -f "$IPA_FILE" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ]; then
            echo "Uploading $IPA_FILE to TestFlight via altool..."
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID"
            echo "App uploaded to TestFlight successfully!"
          else
            echo "IPA file or API Key not found. Skipping altool upload."
          fi

      - name: Upload Build Artifacts to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SnackSwapAdventure-iOS-Build
          path: |
            ./build/output/*.ipa
            ./build/SnackSwapAdventure.xcarchive
          if-no-files-found: ignore

      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
          rm -rf ~/.private_keys ~/.appstoreconnect/private_keys
