# TestFlight CI — all credentials come from GitHub Actions secrets only.
# Never hardcode API keys, issuer IDs, certificates, or passwords here.
#
# Required repository secrets:
#   APPSTORE_API_KEY_ID
#   APPSTORE_API_ISSUER_ID
#   APPSTORE_API_KEY_BASE64
#   BUILD_CERTIFICATE_BASE64
#   P12_PASSWORD

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Track to deploy to"
        required: true
        default: "testflight"
        type: choice
        options:
          - testflight
          - appstore
  push:
    branches: [main, master]

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_IDENTIFIER: com.snackswap.adventure
  APPLE_TEAM_ID: Z2RB57KVQ5

jobs:
  build_and_deploy:
    name: Build & upload iOS
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          for app in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode_26.app \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode.app; do
            if [ -d "$app" ]; then
              echo "Selecting Xcode at $app"
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache Swift Package Manager Dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SnackSwapAdventure/SnackSwapAdventure.xcodeproj \
            -scheme SnackSwapAdventure

      - name: Verify required secrets
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          missing=0
          for v in APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_KEY_BASE64 BUILD_CERTIFICATE_BASE64 P12_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret: $v"
              missing=1
            else
              echo "OK secret present: $v"
            fi
          done
          exit $missing

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary_keychain_password
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode > "$CERTIFICATE_PATH"
          ls -la "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import ALL items (cert + private key). Do NOT use -t cert (drops keys).
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "=== CODE SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Eqi 'Apple Distribution|iPhone Distribution|iOS Distribution'; then
            echo "::error::No Apple Distribution identity with private key found in imported p12."
            exit 1
          fi

      - name: Decode App Store Connect API key
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys build
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"

          if echo "$APPSTORE_API_KEY_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$APPSTORE_API_KEY_BASE64" > "$KEY_PATH"
          else
            echo "$APPSTORE_API_KEY_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"

          python3 - <<'PY'
          import base64, json, os, pathlib
          key_id = os.environ["APPSTORE_API_KEY_ID"]
          issuer = os.environ["APPSTORE_API_ISSUER_ID"]
          key_path = pathlib.Path.home() / ".appstoreconnect/private_keys" / f"AuthKey_{key_id}.p8"
          pem = key_path.read_text()
          out = pathlib.Path("build/asc_api_key.json")
          out.write_text(json.dumps({
              "key_id": key_id,
              "issuer_id": issuer,
              "key": pem,
              "in_house": False,
          }))
          print(f"Wrote {out} for key_id={key_id}")
          PY
          echo "ASC_API_KEY_PATH=$PWD/build/asc_api_key.json" >> "$GITHUB_ENV"
          echo "ASC private key material installed."

      - name: Fetch App Store provisioning profile
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build ~/Library/MobileDevice/Provisioning\ Profiles

          export APP_STORE_CONNECT_API_KEY_KEY_ID="$APPSTORE_API_KEY_ID"
          export APP_STORE_CONNECT_API_KEY_ISSUER_ID="$APPSTORE_API_ISSUER_ID"
          export APP_STORE_CONNECT_API_KEY_KEY_FILEPATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"

          # Use fastlane sigh to download/generate the distribution provisioning profile via ASC API
          gem install fastlane --no-document
          fastlane sigh \
            --app_identifier "$APP_IDENTIFIER" \
            --api_key_path "$PWD/build/asc_api_key.json" \
            --output_path "build" \
            --filename "SnackSwapAdventure_AppStore.mobileprovision"

          PP_PATH="build/SnackSwapAdventure_AppStore.mobileprovision"
          if [ ! -f "$PP_PATH" ]; then
            PP_PATH=$(ls -t ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          fi
          test -f "$PP_PATH"
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/ || true

          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "Using profile: $PROFILE_NAME ($UUID)"

      - name: Build IPA
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          if [ "$BUILD_NUMBER" -le 1 ]; then BUILD_NUMBER=2; fi
          MARKETING_VERSION="1.1"
          ARCHIVE_PATH="$RUNNER_TEMP/SnackSwapAdventure.xcarchive"
          EXPORT_PATH="$PWD/build/ipa"
          mkdir -p "$EXPORT_PATH"

          cat <<EOF > ./ExportOptions-Dynamic.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>destination</key>
          	<string>export</string>
          	<key>method</key>
          	<string>app-store</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>signingCertificate</key>
          	<string>Apple Distribution</string>
          	<key>teamID</key>
          	<string>${APPLE_TEAM_ID}</string>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>${APP_IDENTIFIER}</key>
          		<string>${PROFILE_NAME}</string>
          	</dict>
          	<key>stripSwiftSymbols</key>
          	<true/>
          	<key>uploadSymbols</key>
          	<true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -project SnackSwapAdventure/SnackSwapAdventure.xcodeproj \
            -scheme SnackSwapAdventure \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_IDENTIFIER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean archive

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ./ExportOptions-Dynamic.plist \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

          echo "IPA_PATH=$(ls "$EXPORT_PATH"/*.ipa | head -1)" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.track == 'testflight' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="${IPA_PATH:-$(ls build/ipa/*.ipa | head -1)}"
          echo "Uploading IPA to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Submitted to App Store Connect / TestFlight."

      - name: Upload to App Store
        if: ${{ inputs.track == 'appstore' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="${IPA_PATH:-$(ls build/ipa/*.ipa | head -1)}"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SnackSwapAdventure-ipa
          path: build/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys build
