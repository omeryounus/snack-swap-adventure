name: iOS Build & TestFlight Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload build to TestFlight'
        required: true
        type: boolean
        default: true

jobs:
  build-and-deploy:
    name: Build & Deploy iOS App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Cache Swift Package Manager Dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SnackSwapAdventure/SnackSwapAdventure.xcodeproj \
            -scheme SnackSwapAdventure

      - name: Install Signing Certificate & Provisioning Profile (if provided)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.P12_BASE64 || secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.BUILD_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 || secrets.PROVISION_PROFILE_BASE64 || secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'github-action-keychain-pass' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing signing certificate..."
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"')
          fi

          if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Installing provisioning profile..."
            PP_PATH=$RUNNER_TEMP/profile.mobileprovision
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
            PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PP_DIR"
            UUID=$(security cms -D -i "$PP_PATH" | grep -A1 "<key>UUID</key>" | grep "<string>" | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
            cp "$PP_PATH" "$PP_DIR/$UUID.mobileprovision"
            echo "Provisioning profile $UUID installed."
          fi

      - name: Setup App Store Connect API Key (if provided)
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APPSTORE_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY || secrets.APPSTORE_API_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORE_KEY_ID || secrets.APPLE_KEY_ID }}
        run: |
          if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ] && [ -n "$KEY_ID" ]; then
            echo "Setting up App Store Connect API Key for Key ID: $KEY_ID..."
            mkdir -p ~/.private_keys
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${KEY_ID}.p8
            chmod 600 ~/.private_keys/AuthKey_${KEY_ID}.p8
            echo "API Key AuthKey_${KEY_ID}.p8 prepared."
          fi

      - name: Build & Archive App
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORE_KEY_ID || secrets.APPLE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORE_ISSUER_ID || secrets.APPLE_ISSUER_ID }}
        run: |
          AUTH_FLAGS=""
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -f "$HOME/.private_keys/AuthKey_${KEY_ID}.p8" ]; then
            echo "Using App Store Connect API Key ($KEY_ID) for authentication."
            AUTH_FLAGS="-allowProvisioningUpdates -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID -authenticationKeyPath $HOME/.private_keys/AuthKey_${KEY_ID}.p8"
          else
            echo "Warning: API Key file not found or IDs missing. Using basic allowProvisioningUpdates."
            AUTH_FLAGS="-allowProvisioningUpdates"
          fi

          ARCHIVE_SIGNING_FLAGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          if security list-keychains | grep -q "app-signing.keychain-db"; then
            echo "Using installed keychain certificate for archiving."
            ARCHIVE_SIGNING_FLAGS=""
          fi

          xcodebuild -project SnackSwapAdventure/SnackSwapAdventure.xcodeproj \
            -scheme SnackSwapAdventure \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/SnackSwapAdventure.xcarchive \
            DEVELOPMENT_TEAM=Z2RB57KVQ5 \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            $ARCHIVE_SIGNING_FLAGS \
            $AUTH_FLAGS \
            archive

      - name: Export IPA & Upload to App Store / TestFlight
        if: github.event_name != 'pull_request'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORE_KEY_ID || secrets.APPLE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORE_ISSUER_ID || secrets.APPLE_ISSUER_ID }}
        run: |
          AUTH_FLAGS=""
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -f "$HOME/.private_keys/AuthKey_${KEY_ID}.p8" ]; then
            echo "Using App Store Connect API Key ($KEY_ID) for Export & Upload."
            AUTH_FLAGS="-allowProvisioningUpdates -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID -authenticationKeyPath $HOME/.private_keys/AuthKey_${KEY_ID}.p8"
          else
            AUTH_FLAGS="-allowProvisioningUpdates"
          fi

          xcodebuild -exportArchive \
            -archivePath ./build/SnackSwapAdventure.xcarchive \
            -exportOptionsPlist SnackSwapAdventure/ExportOptions-AppStoreConnect.plist \
            -exportPath ./build/output \
            DEVELOPMENT_TEAM=Z2RB57KVQ5 \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            $AUTH_FLAGS

      - name: Upload Build Artifacts to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SnackSwapAdventure-iOS-Build
          path: |
            ./build/output/*.ipa
            ./build/SnackSwapAdventure.xcarchive
          if-no-files-found: ignore

      - name: Clean up Keychain & API Keys
        if: always()
        run: |
          rm -rf ~/.private_keys/AuthKey_*.p8
          if security list-keychains | grep -q "app-signing.keychain-db"; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          fi
